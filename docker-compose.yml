# Песочница (РП10, ARCHITECTURE «Среды»). Сервисы Платформы и эмуляторов добавляются в своих задачах.
# Пароль — стендовое значение песочницы, не секрет.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
