openapi: 3.0.3
info:
  title: Интерфейсы Платформы с процессингом и участниками
  version: 1.0.0-draft
  description: Каноническая модель. Номера полей и кодов внешних форматов — по альбомам оператора, см. PROCESSING-INTERFACE.md
    [альбом].
components:
  schemas:
    Instrument:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - AGENT_TOKEN
          - ACCOUNT_LINK
          - CARD_TOKEN
        token_ref:
          type: string
        cryptogram:
          type: string
        account_link_ref:
          type: string
        issuer_id:
          type: string
    Merchant:
      type: object
      properties:
        id:
          type: string
        mcc:
          type: string
        acquirer_id:
          type: string
        name:
          type: string
    Aoi:
      type: object
      properties:
        indicator:
          type: boolean
        agent_code:
          type: string
        mandate_id:
          type: string
        fulfilment_ref:
          type: string
          nullable: true
        deal_ref:
          type: string
          nullable: true
    CanonicalMessage:
      type: object
      required:
      - op_ref
      - msg_type
      - channel
      - amount
      - currency
      - merchant
      - instrument
      properties:
        op_ref:
          type: string
        msg_type:
          type: string
          enum:
          - AUTH_REQUEST
          - ISSUER_RESPONSE
          - REVERSAL
          - PRESENTMENT
          - REFUND
          - CHARGEBACK
          - AUTH_EXPIRED
        seq:
          type: integer
        channel:
          type: string
          enum:
          - CARD
          - SBP
        amount:
          type: integer
        currency:
          type: string
        merchant:
          $ref: '#/components/schemas/Merchant'
        instrument:
          $ref: '#/components/schemas/Instrument'
        aoi:
          $ref: '#/components/schemas/Aoi'
        confirmation_ref:
          type: string
          nullable: true
        order_ref:
          type: string
        reservation_id:
          type: string
          nullable: true
        issuer_approved:
          type: boolean
          nullable: true
        ts:
          type: string
          format: date-time
    Decision:
      type: object
      description: 'Пары в ответе ADP (РП19): APPROVE, BYPASS — reason null; DECLINE — код ПИ §6, кроме CONFIRMATION_REQUIRED и ADP_UNAVAILABLE; CONFIRMATION_REQUIRED — reason CONFIRMATION_REQUIRED. ADP_UNAVAILABLE — только в решении процессинга при таймауте ADP (DECLINE / ADP_UNAVAILABLE). Несогласованная пара — отказ.'
      required:
      - decision
      - decided_in_ms
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - DECLINE
          - CONFIRMATION_REQUIRED
          - BYPASS
        reason:
          type: string
          nullable: true
          enum:
          - null
          - AOI_MISSING
          - AOI_MISMATCH
          - AGENT_UNKNOWN
          - AGENT_SUSPENDED
          - CREDENTIAL_INVALID
          - MANDATE_NOT_FOUND
          - MANDATE_EXPIRED
          - MANDATE_REVOKED
          - MANDATE_SCOPE
          - LIMIT_EXCEEDED
          - STATE_UNAVAILABLE
          - CONFIRMATION_REQUIRED
          - ADP_UNAVAILABLE
        split_detected:
          type: boolean
          description: 'Дробление по мандату в окне (РП44 п. 7): true — только у CONFIRMATION_REQUIRED по доле (операция не выше порога, но с одобрениями и записями «в работе» в окне split_window_sec по корневому INTENT их не меньше split_min_ops и сумма выше порога); false — у CONFIRMATION_REQUIRED по порогу одной операции; у прочих решений поля нет.'
        reservation_id:
          type: string
          nullable: true
        agent_level:
          type: integer
        mandate_left_after:
          type: integer
        decided_in_ms:
          type: number
    Limits:
      type: object
      description: "Лимиты клиента (РП45 п. 1, 3). Суммы — целые ≥ 0 в минимальных единицах, парой с currency (ISO 4217, обязательна при любом поле суммы); per_period и period — только вместе; period — календарный период в часовом поясе client_limit_period_tz. Неизвестное поле или period — 422 LIMITS_UNSUPPORTED. per_operation — сумма > per_operation → LIMIT_EXCEEDED; per_period — второй счёт удержаний ядра, резерв тем же op_key после мандата; merchant_categories — MCC вне списка → MANDATE_SCOPE; confirm_above — клиентский порог подтверждения (меньшее с рыночным, РП44 п. 5)."
      additionalProperties: false
      properties:
        per_operation:
          type: integer
          minimum: 0
        per_period:
          type: integer
          minimum: 0
        period:
          type: string
          enum:
          - DAY
          - MONTH
        merchant_categories:
          type: array
          maxItems: 1000
          items:
            type: string
            pattern: '^[0-9]{4}$'
        confirm_above:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    LimitsRecordBody:
      type: object
      description: "Подписанная банком запись лимитов (РП45 п. 1). Подпись Ed25519 ключом банка над canonicalJson записи {context, participant_code, kid, principal_ref, version, limits, issued_at}; context = pao:participant-limits:v1, principal_ref — из пути. Только вставка; действует наибольшая version пары (participant_code, principal_ref)."
      additionalProperties: false
      required:
      - participant_code
      - kid
      - version
      - limits
      - issued_at
      - signature
      properties:
        participant_code:
          type: string
        kid:
          type: string
        version:
          type: integer
          minimum: 1
        limits:
          $ref: '#/components/schemas/Limits'
        issued_at:
          type: string
          format: date-time
        signature:
          type: string
          description: base64url, 64 байта
    StateOp:
      type: object
      required:
      - mandate_id
      - op_ref
      - amount
      properties:
        mandate_id:
          type: string
        op_ref:
          type: string
        amount:
          type: integer
        reservation_id:
          type: string
    DealView:
      type: object
      properties:
        deal_ref:
          type: string
        status:
          type: string
          enum:
          - AWAITING_FUNDING
          - FUNDED
          - RELEASED
          - RETURNED
          - PARTIAL
          - CANCELLED
        amount:
          type: integer
        currency:
          type: string
        payee_merchant_id:
          type: string
        valid_to:
          type: string
          format: date-time
    DealOutcome:
      type: object
      required:
      - outcome
      - at
      properties:
        outcome:
          type: string
          enum:
          - RELEASED
          - RETURNED
          - PARTIAL
        released_amount:
          type: integer
        returned_amount:
          type: integer
        at:
          type: string
          format: date-time
        evidence_hash:
          type: string
paths:
  /adp/v1/decide:
    post:
      summary: ПИ-1 Точка решения
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanonicalMessage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '400':
          description: 'Агентское сообщение некорректно (тело не объект, нет instrument, msg_type не AUTH_REQUEST, op_ref пуст, сумма не целое ≥ 1, валюта не ISO 4217); тело {}. Решения нет — процессинг ставит DECLINE / ADP_UNAVAILABLE агентской операции (РП43 п. 3, доп. п. 20). Неагентская с теми же дефектами — 200 BYPASS.'
        '503':
          description: 'Решения нет: режим «только BYPASS» при непрошедшей самопроверке, сбой точки решения или несогласованная пара; тело {}. Процессинг ставит DECLINE / ADP_UNAVAILABLE агентской операции (РП43 п. 8). Неагентская — 200 BYPASS и в этом режиме.'
  /adp/v1/events:
    post:
      summary: ПИ-3 События операции
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CanonicalMessage'
      responses:
        '202':
          description: Принято
  /participants/v1/principals/{ref}/limits:
    put:
      summary: ПИ-8 Лимиты клиента (эмитент, РП45 п. 1, 3)
      description: "Порядок: тело → подпись банка (неизвестный участник или ключ — тот же 401) → только вставка. Та же версия с той же записью — 200 без новой строки; версия не выше действующей или та же версия с другой записью — 409. Сужение и расширение суммы per_period — сразу с новой версии (setLimit ядра, РП46 (г)); снятие per_period или смена period — со следующего периода (РП45 доп. п. 7). GET — с подписью запроса участника (PS-20 часть 2)."
      parameters:
      - name: ref
        in: path
        required: true
        description: principal_ref клиента
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LimitsRecordBody'
      responses:
        '200':
          description: "Записано или повтор той же записи: {principal_ref, version}"
        '400':
          description: "`REQUEST_INVALID` — тело не по форме, сумма без currency, per_period без period"
        '401':
          description: "`SIGNATURE_INVALID` — подпись не проверена: неизвестный участник или ключ, неверная подпись, иная метка контекста"
        '409':
          description: "`LIMITS_VERSION_CONFLICT` — версия не выше действующей или другая запись той же версии"
        '422':
          description: "`LIMITS_UNSUPPORTED` — неизвестное поле limits или period"
        '503':
          description: "`UPSTREAM_UNAVAILABLE`, Retry-After"
    get:
      summary: ПИ-8 Действующая запись лимитов клиента (эмитент, РП46 (в))
      description: "Подпись HTTP-запроса участника по профилю ПАО §2 (RFC 9421): Signature-Input ровно (\"@method\" \"@path\" \"@query\" \"content-digest\" \"x-participant-code\" \"x-timestamp\" \"x-nonce\"), alg ed25519, ключ — из доверенных ключей участников, окно — signature_skew_sec, nonce однократный. Участник — из проверенной подписи: банк читает только своих клиентов, пара другого банка — 404, как нет записи. Ответ — действующая запись (наибольшая версия) как прислал банк, с его подписью и received_at."
      parameters:
      - name: ref
        in: path
        required: true
        description: principal_ref клиента
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
      - name: x-participant-code
        in: header
        required: true
        schema:
          type: string
      - name: x-timestamp
        in: header
        required: true
        schema:
          type: string
          format: date-time
      - name: x-nonce
        in: header
        required: true
        schema:
          type: string
      - name: content-digest
        in: header
        required: true
        description: digest пустого тела
        schema:
          type: string
      - name: signature-input
        in: header
        required: true
        schema:
          type: string
      - name: signature
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "Действующая запись: {participant_code, kid, principal_ref, version, limits, issued_at, signature, received_at}"
        '400':
          description: "`REQUEST_INVALID` — ref не по маске (после проверенной подписи)"
        '401':
          description: "`SIGNATURE_INVALID` — нет подписи, неизвестный участник или ключ, состав не по профилю, вне окна, повтор nonce"
        '404':
          description: "`LIMITS_NOT_FOUND` — у этого банка записи для клиента нет (в том числе клиент другого банка)"
        '503':
          description: "`UPSTREAM_UNAVAILABLE`, Retry-After"
  /participants/v1/instruments/{funding_ref}/limits:
    put:
      summary: ПИ-8 Ограничения инструмента (эмитент; PS-14 — funding_ref из записи реквизита)
      parameters:
      - name: funding_ref
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Limits'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Limits'
    get:
      summary: Ограничения
      parameters:
      - name: funding_ref
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Limits'
  /participants/v1/mandates/{id}/sign:
    post:
      summary: ПИ-8 Подпись мандата клиентом
      description: "Решение клиента в приложении банка (РП12, РП36). Клиент подписывает мандат простой ЭП по договору с банком; банк присылает запись о решении, подписанную своим ключом Ed25519 над хэшем мандата (`mandate_hash` = `Mandate.hash`, хэш записи журнала). Подписываемая строка — canonicalJson записи с полем `context` = `pao:participant-mandate-signature:v1` и `mandate_id` из пути; в теле `context` и `mandate_id` нет. Ключ — из доверенных ключей участников (до PS-20 — конфигурация). Без подписи точки нет. Запись — только при `PENDING_SIGNATURE`; повтор той же подписи — 200 с текущим статусом, второй записи нет."
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - participant_code
              - kid
              - mandate_hash
              - decision
              - signature_type
              - signature_ref
              - token_consent
              - signed_at
              - signature
              properties:
                participant_code:
                  type: string
                kid:
                  type: string
                  description: отпечаток JWK ключа участника по RFC 7638
                mandate_hash:
                  type: string
                  pattern: ^[0-9a-f]{64}$
                  description: Mandate.hash — SHA-256 hex записи MANDATE_REQUESTED
                decision:
                  type: string
                  enum:
                  - SIGN
                  - REJECT
                signature_type:
                  type: string
                  enum:
                  - simple
                  - qualified
                  - gov_id
                signature_ref:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{1,64}$
                  description: "Непрозрачная ссылка банка без ПДн клиента: семь и более цифр подряд — отказ (не проходят СНИЛС, ЕСИА, телефон); уходит агенту в выписке (РП38 п. 7). Тело не по маске — 400 REQUEST_INVALID"
                token_consent:
                  type: boolean
                signed_at:
                  type: string
                  format: date-time
                signature:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{86}$
                  description: Ed25519 (64 байта), base64url без дополнения
      responses:
        '200':
          description: Решение записано или уже было записано этой подписью
          content:
            application/json:
              schema:
                type: object
                required:
                - mandate_id
                - status
                properties:
                  mandate_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - PENDING_SIGNATURE
                    - ACTIVE
                    - REJECTED
                    - REVOKED
                    - EXPIRED
        '400':
          description: "`REQUEST_INVALID` — тело не по схеме или id не по маске. Тело любой ошибки ПИ-8 подписи — `{code}`, причина — только в журнале процесса"
        '401':
          description: "`SIGNATURE_INVALID` — подпись не проверена: неизвестный участник или ключ, неверная подпись, иная метка контекста"
        '404':
          description: "`MANDATE_NOT_FOUND` — после проверки подписи"
        '409':
          description: "`MANDATE_HASH_MISMATCH` — хэш не равен Mandate.hash; `MANDATE_NOT_PENDING` — решение уже записано другой подписью, мандат отозван, истёк или CART под не-ACTIVE родителем"
        '422':
          description: "`QUALIFIED_SIGNATURE_REQUIRED` — A7 п. 3.2: сумма или срок выше порогов `qualified_signature_above_*` или валюта не RUB, а подпись простая"
        '503':
          description: "`STATE_UNAVAILABLE` / `UPSTREAM_UNAVAILABLE`, Retry-After"
  /participants/v1/mandates/{id}/revoke:
    post:
      summary: ПИ-8 Отзыв мандата клиентом (РП38)
      description: "Одна подпись Ed25519 ключом банка над canonicalJson записи {context, participant_code, kid, mandate_id, mandate_hash, revocation_ref, revoked_at}; context = pao:participant-mandate-revocation:v1. Запись MANDATE_REVOKED при PENDING_SIGNATURE или ACTIVE (у CART — вместе с родителем); REVOKED, REJECTED, EXPIRED — 200 с текущим статусом без записи"
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - participant_code
              - kid
              - mandate_hash
              - revocation_ref
              - revoked_at
              - signature
              properties:
                participant_code:
                  type: string
                kid:
                  type: string
                mandate_hash:
                  type: string
                  pattern: ^[0-9a-f]{64}$
                revocation_ref:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{1,64}$
                  description: "Непрозрачная ссылка банка без ПДн клиента: семь и более цифр подряд — отказ (не проходят СНИЛС, ЕСИА, телефон); уходит агенту в выписке (РП38 п. 7). Тело не по маске — 400 REQUEST_INVALID"
                revoked_at:
                  type: string
                  format: date-time
                signature:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{86}$
                  description: Ed25519 (64 байта), base64url без дополнения
      responses:
        '200':
          description: Отзыв записан, или полномочий уже нет — текущий статус без записи
          content:
            application/json:
              schema:
                type: object
                required:
                - mandate_id
                - status
                properties:
                  mandate_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - REJECTED
                    - REVOKED
                    - EXPIRED
        '400':
          description: "`REQUEST_INVALID` — тело не по схеме или id не по маске; тело ошибки — `{code}`"
        '401':
          description: "`SIGNATURE_INVALID` — подпись не проверена: неизвестный участник или ключ, неверная подпись, иная метка контекста (в том числе метка решения)"
        '404':
          description: "`MANDATE_NOT_FOUND` — после проверки подписи"
        '409':
          description: "`MANDATE_HASH_MISMATCH` — хэш не равен Mandate.hash"
        '503':
          description: "`STATE_UNAVAILABLE` / `UPSTREAM_UNAVAILABLE`, Retry-After"
  /participants/v1/principals/{ref}/revoke-all:
    post:
      summary: ПИ-8 Прекращение всех полномочий клиента одним действием (PS-20 ч. 2, РП45 п. 4, РП46 (а))
      description: "Порядок: тело → подпись банка (Ed25519 над canonicalJson записи {context, participant_code, kid, principal_ref, revocation_ref, revoked_at}, context = pao:participant-principal-revocation:v1; неизвестный участник или ключ — тот же 401) → метка пары (participant_code, principal_ref) под локом пары, номер в паре — порядок фиксации, часы не участвуют → MANDATE_REVOKED с записью банка и mandate.revoked агенту каждому ACTIVE-мандату пары, подписанному до метки (сначала CART, затем корни). С фиксации метки мандаты пары, подписанные до неё, не действуют (ADP, GET, verify). Подпись после метки — новое согласие. PENDING_SIGNATURE не трогается. Повтор того же revocation_ref — прежняя метка, дописываются недописанные записи. Авторизованное до отзыва исполняется (A3 п. 6.3)."
      parameters:
      - name: ref
        in: path
        required: true
        description: principal_ref клиента
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - participant_code
              - kid
              - revocation_ref
              - revoked_at
              - signature
              properties:
                participant_code:
                  type: string
                kid:
                  type: string
                revocation_ref:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{1,64}$
                  description: "Непрозрачная ссылка банка без ПДн клиента; ключ идемпотентности метки"
                revoked_at:
                  type: string
                  format: date-time
                  description: Метка банка; в порядке «до/после» не участвует
                signature:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{86}$
                  description: Ed25519 (64 байта), base64url без дополнения
      responses:
        '200':
          description: Метка и все записи отзыва записаны (или уже были)
          content:
            application/json:
              schema:
                type: object
                required:
                - principal_ref
                - revocation_ref
                - revoked
                properties:
                  principal_ref:
                    type: string
                  revocation_ref:
                    type: string
                  revoked:
                    type: integer
                    minimum: 0
                    description: Число мандатов, отозванных этим вызовом (повтор — 0 или недописанные)
        '400':
          description: "`REQUEST_INVALID` — тело не по схеме, ref не по маске; тело ошибки — `{code}`"
        '401':
          description: "`SIGNATURE_INVALID` — подпись не проверена (в том числе метка отзыва одного мандата)"
        '503':
          description: "`STATE_UNAVAILABLE` / `UPSTREAM_UNAVAILABLE`, Retry-After: сбой посередине — метка уже действует, банк повторяет тот же revocation_ref"
  /participants/v1/notifications:
    get:
      summary: ПИ-8 Лента уведомлений клиента через банк (эмитент, РП46 (б), доп. п. 7, 9, 10; A3 п. 5.3)
      description: "Уведомления клиенту банка: client.mandate_first_use (первое одобрение по мандату, одно на мандат), client.limit_declined (отказ LIMIT_EXCEEDED, одно на операцию, reason — MANDATE, CLIENT или INSTRUMENT (предел инструмента, amount_max реквизита; РП49 (е)); без reason — уведомления по решениям до v0.14.0), client.limit_exhausted (остаток лимита клиента за период стал 0, одно на счёт периода, после отмены операции не отменяется), client.mandate_exhausted (бюджет мандата исчерпан), client.revoked_all (отзыв всех полномочий, одно на revocation_ref). По решениям ADP — уведомителем вне пути авторизации, задержка не больше participant_notify_max_delay_sec; нет сохранённой записи решения — нет уведомления. Подпись HTTP-запроса участника — как GET лимитов (RFC 9421, профиль ПАО §2 с x-participant-code); участник — из проверенной подписи, только свои уведомления. По возрастанию seq, не больше event_page_max за ответ; дальше — следующий запрос с after. Вебхук-сигнал POST {notification_id, seq} на notify_url из записи доверенного участника — без подписи Платформы до SEC-1, содержание — только из этой ленты; без notify_url и после исчерпания попыток — только лента."
      parameters:
      - name: after
        in: query
        required: false
        description: notification_id последнего прочитанного уведомления этого участника; без него — с начала ленты
        schema:
          type: string
          pattern: '^ntf_[0-9a-f]{8}-[0-9a-f]{4}-8[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      - name: x-participant-code
        in: header
        required: true
        schema:
          type: string
      - name: x-timestamp
        in: header
        required: true
        schema:
          type: string
          format: date-time
      - name: x-nonce
        in: header
        required: true
        schema:
          type: string
      - name: content-digest
        in: header
        required: true
        description: digest пустого тела
        schema:
          type: string
      - name: signature-input
        in: header
        required: true
        schema:
          type: string
      - name: signature
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: "{notifications: [{notification_id, seq, type, at, data}]}; data — только principal_ref, mandate_id, agent_code, op_ref, reason, revocation_ref (коды, без текстов и номера карты)"
          content:
            application/json:
              schema:
                type: object
                required: [notifications]
                properties:
                  notifications:
                    type: array
                    items:
                      type: object
                      required: [notification_id, seq, type, at, data]
                      properties:
                        notification_id:
                          type: string
                        seq:
                          type: integer
                          minimum: 1
                        type:
                          type: string
                          enum: [client.mandate_first_use, client.mandate_exhausted, client.limit_exhausted, client.limit_declined, client.revoked_all]
                        at:
                          type: string
                          format: date-time
                        data:
                          type: object
                          required: [principal_ref]
                          properties:
                            principal_ref:
                              type: string
                            mandate_id:
                              type: string
                            agent_code:
                              type: string
                            op_ref:
                              type: string
                            reason:
                              type: string
                              enum: [MANDATE, CLIENT, INSTRUMENT]
                            revocation_ref:
                              type: string
        '400':
          description: "`REQUEST_INVALID` — after чужой, неизвестный, не по форме или повторён, лишний параметр запроса (после проверенной подписи)"
        '401':
          description: "`SIGNATURE_INVALID` — нет подписи, неизвестный участник или ключ, состав не по профилю, вне окна, повтор nonce"
        '503':
          description: "`UPSTREAM_UNAVAILABLE`, Retry-After"
