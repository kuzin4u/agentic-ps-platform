openapi: 3.0.3
info:
  title: Протокол агентских операций (ПАО)
  version: 1.1.0
  description: 'Интерфейс агентов покупателя с Платформой платёжной системы. Описание — AGENT-PROTOCOL.md. Авторизацию платежа
    агент не инициирует (РП2). Номера карт и персональные данные принципала не передаются никогда. Суммы — копейки, время
    — UTC. v1.1.0 — совместимое расширение: условное исполнение (CONDITIONAL-EXECUTION.md, РП13).'
servers:
- url: https://sandbox.platform.local
  description: песочница
components:
  parameters:
    AgentCode:
      name: X-Agent-Code
      in: header
      required: true
      schema:
        type: string
        example: nspk:agent:buyref-01:v3
    Timestamp:
      name: X-Timestamp
      in: header
      required: true
      schema:
        type: string
    Nonce:
      name: X-Nonce
      in: header
      required: true
      schema:
        type: string
    SignatureInput:
      name: Signature-Input
      in: header
      required: true
      schema:
        type: string
    Signature:
      name: Signature
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    ContentDigest:
      name: Content-Digest
      in: header
      required: false
      schema:
        type: string
  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ErrorCode:
      type: string
      enum:
      - AGENT_UNKNOWN
      - AGENT_SUSPENDED
      - AGENT_KEY_REVOKED
      - SIGNATURE_INVALID
      - MANDATE_NOT_FOUND
      - MANDATE_EXPIRED
      - MANDATE_REVOKED
      - MANDATE_SCOPE
      - PRINCIPAL_SIGNATURE_PENDING
      - LIMIT_EXCEEDED
      - STATE_UNAVAILABLE
      - CONFIRMATION_REQUIRED
      - CREDENTIAL_INVALID
      - CREDENTIALS_FORBIDDEN
      - IDEMPOTENCY_REQUIRED
      - IDEMPOTENCY_CONFLICT
      - RATE_LIMITED
      - UPSTREAM_UNAVAILABLE
    Error:
      type: object
      required:
      - code
      - message
      - retry
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        norm:
          type: string
        retry:
          type: string
          enum:
          - never
          - after_fix
          - same_key
          - new_key
          - after_human
    Configuration:
      type: object
      properties:
        versions:
          type: array
          items:
            type: string
        sunset:
          type: object
          additionalProperties:
            type: string
            format: date
        platform_keys:
          type: array
          items:
            $ref: '#/components/schemas/Key'
        algorithms:
          type: array
          items:
            type: string
            enum:
            - ed25519
            - gost3410-2012-256
        endpoints:
          type: object
          additionalProperties:
            type: string
    Key:
      type: object
      required:
      - kid
      - alg
      - public_key
      - status
      properties:
        kid:
          type: string
        alg:
          type: string
        public_key:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ACTIVE
          - REVOKED
          - EXPIRED
    AgentSelf:
      type: object
      properties:
        agent_code:
          type: string
        operator:
          type: string
        class:
          type: string
          enum:
          - BUYER
          - SELLER
          - SURFACE
          - SERVICE
        level:
          type: integer
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - EXCLUDED
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Key'
        rate_limit_per_min:
          type: integer
    MandateRequest:
      type: object
      required:
      - type
      - subject
      - amount_limit
      - currency
      - valid_to
      - merchant_scope
      - principal_ref
      - mode
      properties:
        type:
          type: string
          enum:
          - INTENT
          - CART
        parent_id:
          type: string
          nullable: true
        subject:
          type: string
        amount_limit:
          type: integer
          minimum: 1
        currency:
          type: string
        period:
          type: string
        valid_to:
          type: string
          format: date-time
        merchant_scope:
          type: array
          items:
            type: string
        principal_ref:
          type: string
        mode:
          type: string
          enum:
          - IMMEDIATE
          - AUTONOMOUS
        key_terms_shown:
          type: boolean
          description: агент показал ключевые параметры отдельно от текста (Т3а)
        cart:
          type: object
          nullable: true
          properties:
            merchant_id:
              type: string
            items:
              type: array
              items:
                type: object
                properties:
                  sku:
                    type: string
                  qty:
                    type: integer
                  price:
                    type: integer
            total:
              type: integer
        settlement_mode:
          type: string
          enum:
          - DIRECT
          - CONDITIONAL
          default: DIRECT
        conditional:
          type: object
          nullable: true
          description: только при settlement_mode=CONDITIONAL
          properties:
            provider:
              type: string
              example: cx:nsvr
            deal_ref:
              type: string
    Mandate:
      allOf:
      - $ref: '#/components/schemas/MandateRequest'
      - type: object
        properties:
          id:
            type: string
          agent_code:
            type: string
          status:
            type: string
            enum:
            - PENDING_SIGNATURE
            - ACTIVE
            - REJECTED
            - EXPIRED
            - REVOKED
            - EXHAUSTED
          signature_type:
            type: string
            enum:
            - simple
            - qualified
            - gov_id
          created_at:
            type: string
            format: date-time
          hash:
            type: string
          prev_hash:
            type: string
    MandateVerify:
      type: object
      required:
      - outcome
      - amount_left
      - valid_to
      properties:
        outcome:
          type: string
          enum:
          - CONFIRMED
          - OUT_OF_SCOPE
          - STATE_UNKNOWN
        amount_left:
          type: integer
        valid_to:
          type: string
          format: date-time
        as_of:
          type: string
          format: date-time
    Evidence:
      type: object
      properties:
        mandate_chain:
          type: array
          items:
            $ref: '#/components/schemas/Mandate'
        operations:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
        integrity:
          type: string
          enum:
          - OK
          - BROKEN
    Aoi:
      type: object
      required:
      - indicator
      - agent_code
      - mandate_id
      properties:
        indicator:
          type: boolean
        agent_code:
          type: string
        mandate_id:
          type: string
        fulfilment_ref:
          type: string
          nullable: true
        deal_ref:
          type: string
          nullable: true
    CredentialRequest:
      type: object
      required:
      - mandate_id
      - order_ref
      - merchant_id
      - amount_max
      - currency
      - kind
      properties:
        mandate_id:
          type: string
        order_ref:
          type: string
        merchant_id:
          type: string
        amount_max:
          type: integer
        currency:
          type: string
        kind:
          type: string
          enum:
          - CARD
          - SBP
    Credential:
      type: object
      required:
      - credential_ref
      - kind
      - payload
      - aoi
      - status
      properties:
        credential_ref:
          type: string
        kind:
          type: string
          enum:
          - CARD
          - SBP
        payload:
          type: object
          description: криптограмма агентского токена или идентификатор списания по привязке; номера карты нет
          properties:
            token_ref:
              type: string
            cryptogram:
              type: string
            account_link_ref:
              type: string
            valid_to:
              type: string
              format: date-time
        aoi:
          $ref: '#/components/schemas/Aoi'
        status:
          type: string
          enum:
          - ISSUED
          - USED
          - EXPIRED
          - REVOKED
    ConfirmationRequest:
      type: object
      required:
      - mandate_id
      - merchant_id
      - amount
      - summary
      properties:
        mandate_id:
          type: string
        merchant_id:
          type: string
        amount:
          type: integer
        summary:
          type: string
        channel:
          type: string
          enum:
          - UPK
          - ISSUER_APP
    Confirmation:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - EXPIRED
        link:
          type: string
          description: ссылка УПК для человека
        confirmation_ref:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
    Operation:
      type: object
      properties:
        op_ref:
          type: string
        order_ref:
          type: string
        channel:
          type: string
          enum:
          - CARD
          - SBP
        amount:
          type: integer
        merchant_id:
          type: string
        aoi:
          $ref: '#/components/schemas/Aoi'
        status:
          type: string
          enum:
          - AUTHORIZED
          - DECLINED
          - CONFIRMATION_REQUIRED
          - SETTLED
          - REVERSED
          - REFUNDED
        reason:
          type: string
          nullable: true
        fulfilment:
          type: object
          nullable: true
          properties:
            fulfilment_ref:
              type: string
            final_amount:
              type: integer
            scope_check:
              type: string
            spent_position:
              type: integer
            at:
              type: string
              format: date-time
        deal_ref:
          type: string
          nullable: true
        deal_outcome:
          type: string
          nullable: true
          enum:
          - null
          - RELEASED
          - RETURNED
          - PARTIAL
    DisputeRequest:
      type: object
      required:
      - op_ref
      - reason
      - principal_ack
      properties:
        op_ref:
          type: string
        reason:
          type: string
          enum:
          - NOT_AUTHORIZED
          - QUALITY
          - NOT_DELIVERED
        principal_ack:
          type: string
          description: подтверждение принципала из приложения банка
    Dispute:
      type: object
      properties:
        id:
          type: string
        op_ref:
          type: string
        reason:
          type: string
        in_scope:
          type: boolean
        decision:
          type: string
          enum:
          - REFUND_NO_MERITS
          - ORDINARY_PROCEDURE
          - REJECTED
          - PENDING
    Subscription:
      type: object
      required:
      - url
      - events
      properties:
        url:
          type: string
        events:
          type: array
          items:
            type: string
    Event:
      type: object
      required:
      - event_id
      - type
      - at
      - data
      properties:
        event_id:
          type: string
        type:
          type: string
          enum:
          - mandate.signed
          - mandate.rejected
          - mandate.revoked
          - mandate.exhausted
          - confirmation.required
          - confirmation.approved
          - confirmation.rejected
          - confirmation.expired
          - operation.authorized
          - operation.declined
          - operation.settled
          - operation.refunded
          - agent.key_revoked
          - agent.suspended
          - agent.reinstated
          - dispute.updated
          - deal.funded
          - deal.released
          - deal.returned
        at:
          type: string
          format: date-time
        data:
          type: object
paths:
  /.well-known/pao-configuration:
    get:
      summary: Обнаружение
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Configuration'
  /pao/v1/agent:
    get:
      summary: Свой статус
      parameters:
      - &id002
        $ref: '#/components/parameters/AgentCode'
      - &id003
        $ref: '#/components/parameters/Timestamp'
      - &id004
        $ref: '#/components/parameters/Nonce'
      - &id005
        $ref: '#/components/parameters/SignatureInput'
      - &id006
        $ref: '#/components/parameters/Signature'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSelf'
        '401': &id001
          $ref: '#/components/responses/Error'
        '403': *id001
  /pao/v1/agent/keys:
    post:
      summary: Новый ключ
      parameters: &id009
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - &id007
        $ref: '#/components/parameters/IdempotencyKey'
      - &id008
        $ref: '#/components/parameters/ContentDigest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - alg
              - public_key
              properties:
                alg:
                  type: string
                public_key:
                  type: string
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
        '401': *id001
  /pao/v1/agent/keys/{kid}/revoke:
    post:
      summary: Отзыв своего ключа
      parameters:
      - name: kid
        in: path
        required: true
        schema:
          type: string
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
        '401': *id001
  /pao/v1/mandates:
    post:
      summary: Запрос мандата; подпись — у принципала в банке
      parameters: *id009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MandateRequest'
      responses:
        '201':
          description: Создан, PENDING_SIGNATURE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
        '400': *id001
        '409': *id001
  /pao/v1/mandates/{id}:
    get:
      summary: Мандат этого агента
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
        '404': *id001
  /pao/v1/mandates/{id}/verify:
    get:
      summary: Проверка и остаток
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandateVerify'
        '404': *id001
        '503': *id001
  /pao/v1/mandates/{id}/relinquish:
    post:
      summary: Отказ агента от полномочий
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      - *id007
      - *id008
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mandate'
  /pao/v1/mandates/{id}/evidence:
    get:
      summary: Выписка из журнала согласий
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
  /pao/v1/credentials:
    post:
      summary: Агентский платёжный реквизит на заказ
      parameters: *id009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialRequest'
      responses:
        '201':
          description: Выдан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
        '409': *id001
        '422': *id001
        '428': *id001
        '503': *id001
  /pao/v1/credentials/{ref}:
    get:
      summary: Статус реквизита
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
  /pao/v1/confirmations:
    post:
      summary: Запросить подтверждение у человека
      parameters: *id009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationRequest'
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Confirmation'
  /pao/v1/confirmations/{id}:
    get:
      summary: Статус подтверждения
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Confirmation'
  /pao/v1/operations:
    get:
      summary: Операции по мандату
      parameters:
      - name: mandate_id
        in: query
        required: true
        schema:
          type: string
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Operation'
  /pao/v1/operations/{op_ref}:
    get:
      summary: Операция
      parameters:
      - name: op_ref
        in: path
        required: true
        schema:
          type: string
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '404': *id001
  /pao/v1/disputes:
    post:
      summary: Спор по поручению человека
      parameters: *id009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeRequest'
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
  /pao/v1/disputes/{id}:
    get:
      summary: Спор
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
  /pao/v1/subscription:
    put:
      summary: Подписка на события
      parameters: *id009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Subscription'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
  /pao/v1/events:
    get:
      summary: События (pull)
      parameters:
      - name: after
        in: query
        schema:
          type: string
      - *id002
      - *id003
      - *id004
      - *id005
      - *id006
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
