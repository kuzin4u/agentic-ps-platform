name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # Матрица Node: нижняя граница engines (>=20.19) и текущая LTS (служебная 14.10, часть 2, К3.1; как AG-04 К3.1 агента и П3 agentic-core).
  test-node:
    name: test (${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19", "22"]
    # PostgreSQL для хранилищ шлюза ПАО (РП30 п. 7) — в каждой ветке матрицы, как в agentic-core; страж — tests/unit/pg.test.ts.
    # Пароль — значение CI-базы, не секрет.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Доступ к agentic-core, если он станет закрытым (без секрета шаг ничего не делает)
        env:
          CORE_READ_TOKEN: ${{ secrets.CORE_READ_TOKEN }}
        run: |
          if [ -n "$CORE_READ_TOKEN" ]; then
            git config --global url."https://x-access-token:${CORE_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
      - name: Установка зависимостей
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Аудит зависимостей работающего кода
        run: npm audit --omit=dev --audit-level=high
      - name: Аудит инструментов разработки
        run: npm audit --audit-level=high
      - name: Сверка src/shared со спецификациями
        run: npm run gen:shared:check
      - name: Проверка типов
        run: npm run check
      - name: Линт
        run: npm run lint
      - name: Сборка
        run: npm run build
      - name: Проверка docker-compose.yml
        run: docker compose config --quiet
      - name: Тесты и сценарии приёмки (PostgreSQL — сервис postgres:16)
        run: npm test
        env:
          DATABASE_URL: postgres://platform:platform@localhost:5432/platform
      - name: Стенд для агента — установка из npm pack (РП25)
        run: npm run test:install -- --pack
      # Коммит PR из форка в клоне основного репозитория недоступен — шаг только для PR из этого репозитория и push.
      - name: Стенд для агента — установка по git+https с prepare, как у агента (РП25)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: npm run test:install -- --git ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Поиск ключей и реквизитов
        run: python3 .claude/hooks/scan_secrets.py .

  # Итоговая проверка под прежним именем test — её требует защита ветки main, имя не меняется.
  # if: always() обязателен: без него при красной матрице test была бы пропущена (skipped), а пропущенная обязательная
  # проверка засчитывается как пройденная (ревью #23 агента п. 1). Зелёная — только при success всей матрицы.
  test:
    needs: test-node
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Матрица Node прошла целиком
        run: test "${{ needs.test-node.result }}" = "success"
